# Publicação MANUAL no GitHub Pages (aba Actions → "Publicar no GitHub Pages" → Run workflow).
# Na primeira vez, o próprio workflow liga o Pages (enablement: true). O site fica em
# https://<usuário>.github.io/<repositório>/ — o app usa só caminhos relativos.
# Útil no iPhone: abra esse endereço HTTPS no Safari e "Adicione à Tela de Início".
name: Publicar no GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar ferramentas de desenvolvimento
        run: npm install --no-audit --no-fund
      # Opcional: detector de pose (baixa o MediaPipe e o modelo). Confira a licença do modelo
      # antes de publicar (docs/VISAO_COMPUTACIONAL.md) e descomente a linha abaixo.
      # - run: npm run pose:prepare
      - name: Build de produção
        run: npm run build
      # enablement: true liga o GitHub Pages (fonte = GitHub Actions) na primeira execução,
      # sem precisar mexer em Settings → Pages antes.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
